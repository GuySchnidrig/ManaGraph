name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PAT makes the release PR trigger the pipeline check normally.
          # With the default GITHUB_TOKEN, GitHub holds those runs for manual approval.
          token: ${{ secrets.MANAGRAPH_RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
