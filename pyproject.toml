[project]
name = "managraph"
version = "0.1.0"
description = "A linked data knowledge graph of Magic: The Gathering cards, queryable via SPARQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyoxigraph>=0.5.13",
]

[project.scripts]
managraph = "managraph.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
